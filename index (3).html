<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Home Control</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    padding: 30px 20px;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    transition: 0.3s;
}

body.light {
    background: #f1f5f9;
    color: #0f172a;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.title {
    display: flex;
    align-items: center;
    gap: 15px;
}

.home-icon {
    width: 55px;
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2563eb;
    border-radius: 16px;
    font-size: 28px;
}

h1 {
    font-size: 28px;
}

.subtitle {
    margin-top: 5px;
    font-size: 14px;
    color: #94a3b8;
}

.theme-btn {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: #1e293b;
    color: white;
    font-size: 22px;
    cursor: pointer;
    transition: 0.3s;
}

.theme-btn:hover {
    transform: scale(1.08);
}

body.light .theme-btn {
    background: white;
    color: #0f172a;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
}

.connection {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    margin-bottom: 25px;
    border-radius: 16px;
    background: #1e293b;
}

body.light .connection {
    background: white;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
}

.dot {
    width: 11px;
    height: 11px;
    flex-shrink: 0;
    border-radius: 50%;
    transition: 0.3s;
}

.dot.connected {
    background: #22c55e;
    box-shadow: 0 0 10px #22c55e;
}

.dot.syncing {
    background: #eab308;
    box-shadow: 0 0 10px #eab308;
    animation: pulse 1s infinite;
}

.dot.disconnected {
    background: #ef4444;
    box-shadow: 0 0 10px #ef4444;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
}

.connection-text {
    font-size: 14px;
}

.connection-text small {
    color: #94a3b8;
}

.device {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 100px;
    padding: 20px;
    margin-bottom: 15px;
    gap: 25px;
    border: 2px solid transparent;
    border-radius: 18px;
    background: #1e293b;
    transition: 0.3s;
}

body.light .device {
    background: white;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
}

.device.active {
    border-color: #22c55e;
}

.device-info {
    display: flex;
    align-items: center;
    gap: 15px;
    min-width: 0;
}

.device-icon {
    width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border-radius: 15px;
    background: #334155;
    font-size: 28px;
}

.device.active .device-icon {
    background: #166534;
}

.device-details {
    min-width: 0;
}

.device-name {
    font-size: 19px;
    font-weight: bold;
}

.relay-name {
    margin-top: 5px;
    font-size: 13px;
    color: #94a3b8;
}

.status {
    display: inline-block;
    margin-top: 7px;
    padding: 4px 10px;
    border-radius: 20px;
    background: #334155;
    color: #cbd5e1;
    font-size: 11px;
}

.device.active .status {
    background: #166534;
    color: #bbf7d0;
}

.status.syncing {
    background: #334155;
    color: #eab308;
}

.status.offline {
    background: #450a0a;
    color: #fca5a5;
}

.device.pending {
    opacity: 0.7;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
}

.control-btn {
    width: 80px;
    padding: 12px 10px;
    border: none;
    border-radius: 10px;
    background: #334155;
    color: #cbd5e1;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.control-btn:hover {
    transform: translateY(-2px);
}

.control-btn:active {
    transform: scale(0.95);
}

.on-btn.selected {
    background: #22c55e;
    color: #052e16;
}

.off-btn.selected {
    background: #ef4444;
    color: white;
}

.master {
    margin-top: 25px;
    background: linear-gradient(135deg, #312e81, #1e1b4b);
}

body.light .master {
    background: linear-gradient(135deg, #eef2ff, #e0e7ff);
}

.ip-card {
    padding: 18px 20px;
    margin-bottom: 15px;
    border-radius: 16px;
    background: #1e293b;
}

body.light .ip-card {
    background: white;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
}

.ip-label {
    display: block;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: bold;
}

.ip-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

.ip-input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border: 2px solid #334155;
    border-radius: 10px;
    background: #0f172a;
    color: inherit;
    font-size: 15px;
    outline: none;
    transition: 0.2s;
}

body.light .ip-input {
    background: #f8fafc;
    border-color: #cbd5e1;
}

.ip-input:focus {
    border-color: #2563eb;
}

.ip-input.invalid {
    border-color: #ef4444;
}

.ip-value {
    flex: 1;
    min-width: 0;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 0.5px;
    overflow-wrap: anywhere;
}

.ip-btn {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    flex-shrink: 0;
}

.ip-btn:hover {
    transform: translateY(-2px);
}

.ip-btn.secondary {
    background: #334155;
    color: #cbd5e1;
}

body.light .ip-btn.secondary {
    background: #e2e8f0;
    color: #0f172a;
}

.ip-error {
    margin-top: 8px;
    font-size: 12px;
    color: #f87171;
    min-height: 14px;
}

.hidden {
    display: none !important;
}

footer {
    padding: 10px;
    margin-top: 25px;
    text-align: center;
    color: #64748b;
    font-size: 12px;
}

@media screen and (max-width: 700px) {

    body {
        padding: 20px 15px;
    }

    .container {
        max-width: 600px;
    }

    h1 {
        font-size: 23px;
    }

    .device {
        gap: 15px;
    }

    .control-btn {
        width: 75px;
    }
}

@media screen and (max-width: 520px) {

    body {
        padding: 15px 12px;
    }

    header {
        margin-bottom: 20px;
    }

    .title {
        gap: 10px;
    }

    .home-icon {
        width: 48px;
        height: 48px;
        font-size: 23px;
    }

    h1 {
        font-size: 21px;
    }

    .subtitle {
        font-size: 12px;
    }

    .theme-btn {
        width: 45px;
        height: 45px;
        font-size: 19px;
    }

    .device {
        flex-direction: column;
        align-items: stretch;
        padding: 17px;
    }

    .device-info {
        width: 100%;
    }

    .buttons {
        width: 100%;
    }

    .control-btn {
        width: 50%;
        padding: 13px;
    }
}

@media screen and (max-width: 350px) {

    .device {
        padding: 14px;
    }

    .device-icon {
        width: 50px;
        height: 50px;
        font-size: 24px;
    }

    .device-name {
        font-size: 16px;
    }

    .control-btn {
        font-size: 13px;
    }
}

</style>

</head>

<body>

<div class="container">

<header>

<div class="title">

<div class="home-icon">🏠</div>

<div>

<h1>Smart Home</h1>

<div class="subtitle">
Home Automation Control
</div>

</div>

</div>

<button
class="theme-btn"
id="themeBtn"
onclick="toggleTheme()">
🌙 </button>

</header>

<div class="ip-card">

<label class="ip-label" for="ipInput">ESP32 IP Address</label>

<form class="ip-row" id="ipEditRow" onsubmit="saveIp(event)">

<input
class="ip-input"
id="ipInput"
type="text"
inputmode="decimal"
placeholder="e.g. 192.168.1.8"
autocomplete="off"
spellcheck="false">

<button type="submit" class="ip-btn">Save</button>

<button
type="button"
class="ip-btn secondary hidden"
id="ipCancelBtn"
onclick="cancelEditIp()">Cancel</button>

</form>

<div class="ip-row hidden" id="ipSavedRow">

<div class="ip-value" id="ipValue"></div>

<button type="button" class="ip-btn secondary" onclick="editIp()">✏️ Edit</button>

</div>

<div class="ip-error" id="ipError"></div>

</div>

<div class="connection">

<div class="dot disconnected" id="connectionDot"></div>

<div class="connection-text" id="connectionText">

No IP saved

<br>

<small>Enter the ESP32 IP address above</small>

</div>

</div>

<div class="device pending" id="device1">

<div class="device-info">

<div class="device-icon">💡</div>

<div class="device-details">

<div class="device-name">
Light
</div>

<div class="relay-name">
Relay 1
</div>

<div class="status syncing" id="status1">
Syncing...
</div>

</div>

</div>

<div class="buttons">

<button
class="control-btn on-btn"
id="on1"
onclick="relayControl(1, 0)">
ON </button>

<button
class="control-btn off-btn"
id="off1"
onclick="relayControl(1, 1)">
OFF </button>

</div>

</div>

<div class="device pending" id="device2">

<div class="device-info">

<div class="device-icon">💡</div>

<div class="device-details">

<div class="device-name">
Tube Light
</div>

<div class="relay-name">
Relay 2
</div>

<div class="status syncing" id="status2">
Syncing...
</div>

</div>

</div>

<div class="buttons">

<button
class="control-btn on-btn"
id="on2"
onclick="relayControl(2, 0)">
ON </button>

<button
class="control-btn off-btn"
id="off2"
onclick="relayControl(2, 1)">
OFF </button>

</div>

</div>

<div class="device pending" id="device3">

<div class="device-info">

<div class="device-icon">🌀</div>

<div class="device-details">

<div class="device-name">
Fan
</div>

<div class="relay-name">
Relay 3
</div>

<div class="status syncing" id="status3">
Syncing...
</div>

</div>

</div>

<div class="buttons">

<button
class="control-btn on-btn"
id="on3"
onclick="relayControl(3, 0)">
ON </button>

<button
class="control-btn off-btn"
id="off3"
onclick="relayControl(3, 1)">
OFF </button>

</div>

</div>

<div class="device pending" id="device4">

<div class="device-info">

<div class="device-icon">🔌</div>

<div class="device-details">

<div class="device-name">
Switch Board
</div>

<div class="relay-name">
Relay 4
</div>

<div class="status syncing" id="status4">
Syncing...
</div>

</div>

</div>

<div class="buttons">

<button
class="control-btn on-btn"
id="on4"
onclick="relayControl(4, 0)">
ON </button>

<button
class="control-btn off-btn"
id="off4"
onclick="relayControl(4, 1)">
OFF </button>

</div>

</div>

<div class="device master pending" id="device5">

<div class="device-info">

<div class="device-icon">⚡</div>

<div class="device-details">

<div class="device-name">
Master Power
</div>

<div class="relay-name">
Main Power Control
</div>

<div class="status syncing" id="status5">
Syncing...
</div>

</div>

</div>

<div class="buttons">

<button
class="control-btn on-btn"
id="on5"
onclick="powerControl(0)">
ON </button>

<button
class="control-btn off-btn"
id="off5"
onclick="powerControl(1)">
OFF </button>

</div>

</div>

<footer>
Smart Home Automation • ESP32
</footer>

</div>

<script>

const IP_STORAGE_KEY = "esp32_ip";

let ESP32_IP = localStorage.getItem(IP_STORAGE_KEY) || "";
let pollTimer = null;
const POLL_INTERVAL_MS = 1500;
const REQUEST_TIMEOUT_MS = 4000;
const DEVICE_IDS = [1, 2, 3, 4, 5];

let isPolling = false;

function fetchWithTimeout(url, timeoutMs) {

const controller = new AbortController();

const timer = setTimeout(() => controller.abort(), timeoutMs);

return fetch(url, { signal: controller.signal })
.finally(() => clearTimeout(timer));

}

function setConnectionState(state) {

const dot = document.getElementById("connectionDot");

const text = document.getElementById("connectionText");

dot.classList.remove("connected", "syncing", "disconnected");

dot.classList.add(state);

if (state === "connected") {

text.innerHTML = `ESP32 Connected<br><small>${ESP32_IP}</small>`;

} else if (state === "syncing") {

text.innerHTML = `Syncing...<br><small>${ESP32_IP}</small>`;

} else {

text.innerHTML = `ESP32 Disconnected<br><small>${ESP32_IP}</small>`;

}

}

function applyDeviceState(id, state) {

const card = document.getElementById("device" + id);

const status = document.getElementById("status" + id);

const onButton = document.getElementById("on" + id);

const offButton = document.getElementById("off" + id);

card.classList.remove("pending");

status.classList.remove("syncing", "offline");

if (state === 0) {

card.classList.add("active");

status.innerText = "ON";

onButton.classList.add("selected");

offButton.classList.remove("selected");

} else {

card.classList.remove("active");

status.innerText = "OFF";

onButton.classList.remove("selected");

offButton.classList.add("selected");

}

}

function setDeviceOffline(id) {

const card = document.getElementById("device" + id);

const status = document.getElementById("status" + id);

const onButton = document.getElementById("on" + id);

const offButton = document.getElementById("off" + id);

card.classList.remove("active", "pending");

status.classList.remove("syncing");

status.classList.add("offline");

status.innerText = "Offline";

onButton.classList.remove("selected");

offButton.classList.remove("selected");

}

function setDeviceSyncing(id) {

const status = document.getElementById("status" + id);

status.classList.remove("offline");

status.classList.add("syncing");

status.innerText = "Syncing...";

}

function applyStatus(data) {

applyDeviceState(1, data.relay1);

applyDeviceState(2, data.relay2);

applyDeviceState(3, data.relay3);

applyDeviceState(4, data.relay4);

applyDeviceState(5, data.power);

}

function markAllOffline() {

DEVICE_IDS.forEach(setDeviceOffline);

}

function poll() {

if (isPolling || !ESP32_IP) {
return Promise.resolve();
}

isPolling = true;

return fetchWithTimeout(`http://${ESP32_IP}/status`, REQUEST_TIMEOUT_MS)

.then(response => {

if (!response.ok) {
throw new Error("ESP32 responded with an error");
}

return response.json();

})

.then(data => {

setConnectionState("connected");

applyStatus(data);

})

.catch(error => {

console.error("Status fetch failed:", error);

setConnectionState("disconnected");

markAllOffline();

})

.finally(() => {

isPolling = false;

});

}

function startPolling() {

stopPolling();

if (!ESP32_IP) {
return;
}

setConnectionState("syncing");

poll();

pollTimer = setInterval(poll, POLL_INTERVAL_MS);

}

function stopPolling() {

if (pollTimer) {
clearInterval(pollTimer);
pollTimer = null;
}

}

function isValidIp(value) {

// Accepts IPv4 (optionally with :port) or a hostname like esp32.local
const ipv4 = /^((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(:\d{1,5})?$/;

const host = /^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*(:\d{1,5})?$/;

return ipv4.test(value) || (host.test(value) && /[a-zA-Z]/.test(value));

}

function showIpSaved() {

document.getElementById("ipValue").innerText = ESP32_IP;

document.getElementById("ipSavedRow").classList.remove("hidden");

document.getElementById("ipEditRow").classList.add("hidden");

document.getElementById("ipError").innerText = "";

}

function showIpEditor() {

const input = document.getElementById("ipInput");

input.value = ESP32_IP;

input.classList.remove("invalid");

document.getElementById("ipEditRow").classList.remove("hidden");

document.getElementById("ipSavedRow").classList.add("hidden");

document.getElementById("ipCancelBtn").classList.toggle("hidden", !ESP32_IP);

input.focus();

}

function saveIp(event) {

event.preventDefault();

const input = document.getElementById("ipInput");

const error = document.getElementById("ipError");

const value = input.value.trim().replace(/^https?:\/\//, "").replace(/\/+$/, "");

if (!isValidIp(value)) {

input.classList.add("invalid");

error.innerText = "Please enter a valid IP address (e.g. 192.168.1.8)";

return;

}

ESP32_IP = value;

localStorage.setItem(IP_STORAGE_KEY, value);

showIpSaved();

DEVICE_IDS.forEach(id => {
const card = document.getElementById("device" + id);
card.classList.add("pending");
setDeviceSyncing(id);
});

startPolling();

}

function editIp() {

showIpEditor();

}

function cancelEditIp() {

if (ESP32_IP) {
showIpSaved();
}

}

function relayControl(relay, state) {

if (!ESP32_IP) {
showIpEditor();
document.getElementById("ipError").innerText = "Please save the ESP32 IP address first";
return;
}

setDeviceSyncing(relay);

const url =
`http://${ESP32_IP}/relay?relay=${relay}&state=${state}`;

fetchWithTimeout(url, REQUEST_TIMEOUT_MS)

.then(response => {

if (!response.ok) {
throw new Error("ESP32 Error");
}

return poll();

})

.catch(error => {

console.error(error);

setConnectionState("disconnected");

setDeviceOffline(relay);

});

}

function powerControl(state) {

if (!ESP32_IP) {
showIpEditor();
document.getElementById("ipError").innerText = "Please save the ESP32 IP address first";
return;
}

setDeviceSyncing(5);

const url =
`http://${ESP32_IP}/power?state=${state}`;

fetchWithTimeout(url, REQUEST_TIMEOUT_MS)

.then(response => {

if (!response.ok) {
throw new Error("ESP32 Error");
}

return poll();

})

.catch(error => {

console.error(error);

setConnectionState("disconnected");

setDeviceOffline(5);

});

}

function toggleTheme() {

document.body.classList.toggle("light");

const button =
document.getElementById("themeBtn");

if (document.body.classList.contains("light")) {

button.innerText = "☀️";

localStorage.setItem("theme", "light");

} else {

button.innerText = "🌙";

localStorage.setItem("theme", "dark");

}

}

window.onload = function() {

const theme =
localStorage.getItem("theme");

if (theme === "light") {

document.body.classList.add("light");

document.getElementById("themeBtn").innerText = "☀️";

}

if (ESP32_IP) {

showIpSaved();

startPolling();

} else {

showIpEditor();

markAllOffline();

}

};

</script>

</body>
</html>
